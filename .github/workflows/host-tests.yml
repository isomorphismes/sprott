name: host tests

on:
  push:
  pull_request:

permissions:
  contents: read
  actions: read

jobs:
  sprott-system:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: isomorphisms/ai-ci/ick-host@ba3ff90023b09e525313793554edecf2141ff95b
        id: ick
      - name: Compile and execute the numerical core with ICK
        run: make test ICK="${{ steps.ick.outputs.compiler }}" ICK_LINK_FLAGS="${{ steps.ick.outputs.link_flags }}"
      - name: Check out pinned owned-source guard
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/ai-ci
          ref: ba3ff90023b09e525313793554edecf2141ff95b
          path: .aici
          sparse-checkout: |
            c-source
            src/aici.c
            contracts/build-toolchain-v0.contract.tsv
          persist-credentials: false
      - name: Compile and enforce the stage toolchain contract
        run: |
          "${{ steps.ick.outputs.compiler }}" ${{ steps.ick.outputs.link_flags }} -std=c17 -O2 -Wall -Wextra -Werror .aici/src/aici.c -o "$RUNNER_TEMP/aici-icky"
          "$RUNNER_TEMP/aici-icky" verify .aici/contracts/build-toolchain-v0.contract.tsv .
      - name: Reject ordinary assignments in the converted core and tests
        run: make -f .aici/c-source/Makefile check ICK="${{ steps.ick.outputs.compiler }}" ICK_LINK_FLAGS="${{ steps.ick.outputs.link_flags }}" FILES="src/sprott_system.c tests/test_sprott_system.c tests/functorial_equivalence.c"


  android-native-ick:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        abi: [armeabi-v7a, arm64-v8a, x86_64]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
      - name: Install the pinned Android NDK
        run: sdkmanager "ndk;29.0.14206865" "platforms;android-36" "build-tools;36.0.0"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Check shared copies and acquire canonical Grease
        uses: isomorphisms/ai-ci/.github/actions/charcoal-vendor@876a843dd7c5c635adaba854a53fd6f2c2139210
        with:
          header: android/native/charcoal.h
          resources: android/res
      - name: Build and qualify ICK for Android
        uses: isomorphisms/ai-ci/ick-android@f6d825d15cd3c0c34ae1b43240a463ff5d343090
        id: ick
        with:
          abi: ${{ matrix.abi }}
          ndk: ${{ env.ANDROID_HOME }}/ndk/29.0.14206865
      - name: Compile every owned C unit with ICK and link the Android library
        env:
          ICK_CC: ${{ steps.ick.outputs.compiler }}
          ANDROID_ABI: ${{ matrix.abi }}
          ANDROID_API: '21'
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/29.0.14206865
        run: bash android/build-native.sh
      - name: Compile and link the actual window resource table
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: 'grease/bin/grease android/link-resources.grease "$ANDROID_HOME/build-tools/36.0.0/aapt2" "$ANDROID_HOME/platforms/android-36/android.jar" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/sprott-window-${{ matrix.abi }}.apk"'
