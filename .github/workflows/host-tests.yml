name: host tests

on:
  push:
  pull_request:

jobs:
  sprott-system:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: isomorphisms/ai-ci/ick-host@ec45ac1d3acd1bcacd1fe6fb271df48e2c22f9b8
        id: ick
      - name: Compile and execute the numerical core with ICK
        run: make test ICK="${{ steps.ick.outputs.compiler }}" ICK_LINK_FLAGS="${{ steps.ick.outputs.link_flags }}"
      - name: Check out pinned owned-source guard
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/ai-ci
          ref: ec45ac1d3acd1bcacd1fe6fb271df48e2c22f9b8
          path: .aici
          sparse-checkout: |
            c-source
            src/aici.c
            contracts/build-toolchain-v0.contract.tsv
          persist-credentials: false
      - name: Compile and enforce the stage toolchain contract
        run: |
          "${{ steps.ick.outputs.compiler }}" ${{ steps.ick.outputs.link_flags }} -std=c17 -O2 -Wall -Wextra -Werror .aici/src/aici.c -o "$RUNNER_TEMP/aici-icky"
          "$RUNNER_TEMP/aici-icky" verify .aici/contracts/build-toolchain-v0.contract.tsv .
      - name: Reject ordinary assignments in the converted core and tests
        run: make -f .aici/c-source/Makefile check ICK="${{ steps.ick.outputs.compiler }}" ICK_LINK_FLAGS="${{ steps.ick.outputs.link_flags }}" FILES="src/sprott_system.c tests/test_sprott_system.c tests/functorial_equivalence.c"


  android-native-ick:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: armeabi-v7a
            gnu_target: arm-linux-gnueabi
            binutils_package: binutils-arm-linux-gnueabi
            binutils_prefix: arm-linux-gnueabi
          - abi: arm64-v8a
            gnu_target: aarch64-linux-gnu
            binutils_package: binutils-aarch64-linux-gnu
            binutils_prefix: aarch64-linux-gnu
          - abi: x86_64
            gnu_target: x86_64-linux-gnu
            binutils_package: binutils-x86-64-linux-gnu
            binutils_prefix: x86_64-linux-gnu

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Check out pinned ICK source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: dilapidated-shed/ick
          ref: c5d28dde9cc333a562b907785d0370b725146cdf
          path: _ick
          submodules: true

      - name: Materialize pinned ICK source
        shell: bash
        run: |
          set -euxo pipefail
          . _ick/ick/SOURCE.lock
          test "$(git -C _ick/gcc rev-parse HEAD)" = "$gcc_commit"
          (
            cd _ick
            sh ick/materialize.sh gcc source
          )

      - name: Install ICK build tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential flex bison texinfo \
            libgmp-dev libmpfr-dev libmpc-dev libisl-dev libzstd-dev \
            "${{ matrix.binutils_package }}"

      - name: Build ICK for ${{ matrix.abi }}
        shell: bash
        run: |
          set -euxo pipefail
          target_as="$(command -v "${{ matrix.binutils_prefix }}-as")"
          target_ld="$(command -v "${{ matrix.binutils_prefix }}-ld")"
          mkdir _ick-build _ick-stage
          (
            cd _ick-build
            ../_ick/source/configure \
              --target="${{ matrix.gnu_target }}" \
              --prefix="$GITHUB_WORKSPACE/_ick-stage" \
              --with-as="$target_as" \
              --with-ld="$target_ld" \
              --enable-languages=c \
              --disable-bootstrap \
              --disable-multilib \
              --disable-nls \
              --disable-shared \
              --disable-threads \
              --without-headers \
              --disable-libatomic \
              --disable-libgomp \
              --disable-libquadmath \
              --disable-libssp \
              --disable-libvtv
          )
          make -C _ick-build -j2 all-gcc
          make -C _ick-build install-gcc
          ick="$GITHUB_WORKSPACE/_ick-stage/bin/${{ matrix.gnu_target }}-gcc"
          test "$("$ick" -dumpmachine)" = "${{ matrix.gnu_target }}"
          test -x "$("$ick" -print-prog-name=cc1)"

      - name: Compile Sprott core with ICK and link Android library
        shell: bash
        run: |
          set -euxo pipefail
          ICK_CC="$GITHUB_WORKSPACE/_ick-stage/bin/${{ matrix.gnu_target }}-gcc" \
          ANDROID_ABI="${{ matrix.abi }}" \
            bash android/build-native.sh
