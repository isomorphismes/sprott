name: Agda

on:
  push:
    branches:
      - Agda
    paths:
      - "agda/**"
      - ".github/workflows/agda.yml"
  pull_request:
    paths:
      - "agda/**"
      - ".github/workflows/agda.yml"

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: agda/agda-setup-action@v1
        with:
          agda-version: "2.8.0"
      - name: Typecheck PROG06
        run: agda -i agda agda/Sprott/Prog06.agda
      - name: Typecheck smoke surface
        run: agda -i agda agda/Sprott/Smoke.agda
